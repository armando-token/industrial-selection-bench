  vector_top_k: 12
  context_top_k: 8
  parent_chunk_target_tokens: 500
  embedding_window_tokens: 96
  embedding_window_overlap: 16
  rrf_constant: 60
  retrieval_rounds_max: 2
scrape:
  max_model_rounds_total: 8
  max_model_rounds: 8
  max_tool_calls: 12
  reserve_final_model_round: true
  final_max_output_tokens: 2048
  cross_request_document_cache: false
statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  success_noninferiority_margin: 0.05
  latency_reduction_target: 0.20
  cost_reduction_target: 0.20
